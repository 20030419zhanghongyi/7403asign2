name: cisc7403-project2
services:
  backend1:
    build:
      context: ./backend
    image: cisc7403-backend:v1
    environment:
      - INSTANCE_NAME=backend1
    networks:
      - app_net

  backend2:
    build:
      context: ./backend
    image: cisc7403-backend:v1
    environment:
      - INSTANCE_NAME=backend2
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    ports:
      - "6120:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
